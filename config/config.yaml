universe:
  metals:
    - "GC=F"    # Gold futures
    - "SI=F"    # Silver futures
    - "PL=F"    # Platinum futures
    - "PA=F"    # Palladium futures
  etfs:
    - "GLD"
    - "SLV"
    - "GDX"
  macro_context:
    - "SPY"
    - "TLT"
    - "UUP"
    - "^VIX"
  # Phase 8: 9-asset cross-sectional basket (ranked in the CS pipeline)
  ranked_assets:
    metals:
      - "GC=F"    # Gold
      - "SI=F"    # Silver
      - "PL=F"    # Platinum
      - "PA=F"    # Palladium
    energy:
      - "CL=F"    # WTI Crude Oil
      - "NG=F"    # Natural Gas
    industrial:
      - "HG=F"    # Copper
    agricultural:
      - "ZC=F"    # Corn
      - "ZS=F"    # Soybeans

fred_series:
  - "DFII10"    # 10Y TIPS real yield
  - "T10YIE"    # 10Y breakeven inflation
  - "DGS10"     # 10Y nominal Treasury yield
  - "DGS2"      # 2Y nominal Treasury yield (yield curve slope)
  - "DTWEXBGS"  # Broad trade-weighted USD index
  - "VIXCLS"    # VIX (FRED version)

dates:
  start: "2005-01-01"    # extended from 2010-01-01 for Phase 14
  end: "2024-12-31"

horizon: 5          # forecast horizon in trading days (target: forward return at t+horizon)

cost_bps: 5         # round-trip transaction cost in basis points

splitter:
  n_splits: 8
  train_years: 3    # minimum training window in years
  test_years: 1     # out-of-sample test window per fold
  embargo: 5        # embargo gap in trading days (must be >= horizon)

random_seed: 42

cftc:
  report_type: "disaggregated_fut"
  codes:
    "GC=F": "088691"    # Gold - COMEX
    "SI=F": "084691"    # Silver - COMEX
    "PL=F": "076651"    # Platinum - NYMEX
    "PA=F": "075651"    # Palladium - NYMEX
    "CL=F": "067651"    # Crude Oil WTI - NYMEX
    "NG=F": "023651"    # Natural Gas - NYMEX
    "HG=F": "085692"    # Copper - COMEX
    "ZC=F": "002602"    # Corn - CBOT
    "ZS=F": "005602"    # Soybeans - CBOT

live:
  retrain_staleness_days: 7    # retrain model if older than this
  default_horizon: 5           # default forecast horizon
  signal_output_dir: "outputs/signals"

vol_targeting:
  target_vol: 0.10          # annualized target portfolio vol (10%)
  max_leverage: 2.0         # position scale clip upper bound
  lookback_days: 21         # trailing window for realized vol estimate

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  outputs_figures: "outputs/figures"
  outputs_reports: "outputs/reports"
  outputs_models: "outputs/models"

# Phase 20: forex universe — 15 pairs (7 majors + 8 crosses).
# Forex is 24/5; yfinance records a 5pm ET close for all pairs simultaneously.
# No late-close lag needed (all pairs use the same timestamp).
# No COT (not configured for forex). No carry_proxy (no ETF pairs).
# With 15 assets: top-3 long, bottom-3 short.
forex:
  ranked_assets:
    # Majors (Phase 18)
    - "EURUSD=X"    # Euro / USD
    - "GBPUSD=X"    # British Pound / USD
    - "USDJPY=X"    # USD / Japanese Yen
    - "AUDUSD=X"    # Australian Dollar / USD
    - "USDCAD=X"    # USD / Canadian Dollar
    - "USDCHF=X"    # USD / Swiss Franc
    - "NZDUSD=X"    # New Zealand Dollar / USD
    # Crosses (Phase 20)
    - "EURJPY=X"    # Euro / Japanese Yen
    - "GBPJPY=X"    # British Pound / Japanese Yen
    - "EURGBP=X"    # Euro / British Pound
    - "AUDJPY=X"    # Australian Dollar / Japanese Yen
    - "EURAUD=X"    # Euro / Australian Dollar
    - "GBPAUD=X"    # British Pound / Australian Dollar
    - "AUDNZD=X"    # Australian Dollar / New Zealand Dollar
    - "CADJPY=X"    # Canadian Dollar / Japanese Yen
  context:
    - "SPY"
    - "TLT"
    - "UUP"
    - "^VIX"
  start_date: "2005-01-01"
  cost_bps: 3       # spread-only broker (Fusion Markets): ~1-2 bps/side

# Phase 16: equity sector universe — parallel to the commodity universe above.
# The 9 original SPDR sector ETFs with history back to 1998.
equity_sectors:
  ranked_assets:
    - "XLB"    # Materials
    - "XLE"    # Energy
    - "XLF"    # Financials
    - "XLI"    # Industrials
    - "XLK"    # Technology
    - "XLP"    # Consumer Staples
    - "XLU"    # Utilities
    - "XLV"    # Health Care
    - "XLY"    # Consumer Discretionary
  context:
    - "SPY"
    - "TLT"
    - "UUP"
    - "^VIX"
  start_date: "1999-01-01"
  cost_bps: 3       # ETF: ~1-2 bps spread + commission

# Phase 20: crypto universe — 10 major tokens filtered to business days.
# Crypto trades 24/7; yfinance includes weekends. Pipeline filters to Mon-Fri
# so weekend returns are absorbed into Monday's bar (slight approximation).
crypto:
  ranked_assets:
    - "BTC-USD"     # Bitcoin (since ~2014)
    - "ETH-USD"     # Ethereum (since ~2017)
    - "XRP-USD"     # Ripple (since ~2017)
    - "LTC-USD"     # Litecoin (since ~2014)
    - "ADA-USD"     # Cardano (since ~2017)
    - "LINK-USD"    # Chainlink (since ~2019)
    - "DOGE-USD"    # Dogecoin (since ~2019)
    - "SOL-USD"     # Solana (since ~2020)
    - "AVAX-USD"    # Avalanche (since ~2020)
    - "DOT-USD"     # Polkadot (since ~2020)
  context:
    - "^VIX"
    - "SPY"
    - "TLT"
  start_date: "2020-01-01"  # common start for all 10 tokens
  cost_bps: 20              # Binance/Kraken: 0.1% per side = 20 bps round-trip
  # Crypto-specific splitter: ~5 years of data needs smaller windows than global (20yr) config
  splitter:
    train_years: 1.5   # 378 bdays minimum training
    test_years: 0.5    # 126 bdays per fold
    n_splits: 3        # 3 non-overlapping annual folds
