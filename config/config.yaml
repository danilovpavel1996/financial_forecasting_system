universe:
  metals:
    - "GC=F"    # Gold futures
    - "SI=F"    # Silver futures
    - "PL=F"    # Platinum futures
    - "PA=F"    # Palladium futures
  etfs:
    - "GLD"
    - "SLV"
    - "GDX"
  macro_context:
    - "SPY"
    - "TLT"
    - "UUP"
    - "^VIX"
  # Phase 8: 9-asset cross-sectional basket (ranked in the CS pipeline)
  ranked_assets:
    metals:
      - "GC=F"    # Gold
      - "SI=F"    # Silver
      - "PL=F"    # Platinum
      - "PA=F"    # Palladium
    energy:
      - "CL=F"    # WTI Crude Oil
      - "NG=F"    # Natural Gas
    industrial:
      - "HG=F"    # Copper
    agricultural:
      - "ZC=F"    # Corn
      - "ZS=F"    # Soybeans

fred_series:
  - "DFII10"    # 10Y TIPS real yield
  - "T10YIE"    # 10Y breakeven inflation
  - "DGS10"     # 10Y nominal Treasury yield
  - "DGS2"      # 2Y nominal Treasury yield (yield curve slope)
  - "DTWEXBGS"  # Broad trade-weighted USD index
  - "VIXCLS"    # VIX (FRED version)

dates:
  start: "2005-01-01"    # extended from 2010-01-01 for Phase 14
  end: "2024-12-31"

horizon: 5          # forecast horizon in trading days (target: forward return at t+horizon)

cost_bps: 5         # round-trip transaction cost in basis points

splitter:
  n_splits: 8
  train_years: 3    # minimum training window in years
  test_years: 1     # out-of-sample test window per fold
  embargo: 5        # embargo gap in trading days (must be >= horizon)

random_seed: 42

cftc:
  report_type: "disaggregated_fut"
  codes:
    "GC=F": "088691"    # Gold - COMEX
    "SI=F": "084691"    # Silver - COMEX
    "PL=F": "076651"    # Platinum - NYMEX
    "PA=F": "075651"    # Palladium - NYMEX
    "CL=F": "067651"    # Crude Oil WTI - NYMEX
    "NG=F": "023651"    # Natural Gas - NYMEX
    "HG=F": "085692"    # Copper - COMEX
    "ZC=F": "002602"    # Corn - CBOT
    "ZS=F": "005602"    # Soybeans - CBOT

live:
  retrain_staleness_days: 7    # retrain model if older than this
  default_horizon: 5           # default forecast horizon
  signal_output_dir: "outputs/signals"

vol_targeting:
  target_vol: 0.10          # annualized target portfolio vol (10%)
  max_leverage: 2.0         # position scale clip upper bound
  lookback_days: 21         # trailing window for realized vol estimate

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  outputs_figures: "outputs/figures"
  outputs_reports: "outputs/reports"
  outputs_models: "outputs/models"
