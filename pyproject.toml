[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial_forecasting_system"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy==1.15.3",
    "scikit-learn==1.6.1",
    "yfinance==0.2.61",
    "fredapi==0.5.2",
    "pandas-datareader==0.10.0",
    "cot_reports>=0.4",
    "lightgbm==4.6.0",
    "arch==7.2.0",
    "pyyaml==6.0.2",
    "python-dotenv==1.1.0",
    "pyarrow==18.1.0",
    "matplotlib==3.10.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
